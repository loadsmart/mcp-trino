version: 2.1

orbs:
  sentinel: loadsmart/sentinel@1
  lumper: loadsmart/lumper@4

jobs:
  # Builds docker/Dockerfile and pushes it to the de-data-mcps ECR repository as
  # mcp-trino-<branch>. de-data-mcps owns the repository and the CircleCI project
  # (terraform/general) and deploys mcp-trino-qa to QA, mcp-trino-main to production.
  build-and-push:
    docker:
      - image: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/lumper:latest
        aws_auth:
          oidc_role_arn: arn:aws:iam::845156828388:role/circleci-lumper-pull
    steps:
      - checkout
      - setup_remote_docker
      - lumper/use-project-roles

      - run:
          name: Build docker image
          command: |
            [ ! -f ~/.aws/oidc.env ] || . ~/.aws/oidc.env
            lumper build aws --project de-data-mcps --build-arg RELEASE=${CIRCLE_TAG:-${CIRCLE_SHA1:0:8}} --tag mcp-trino-${CIRCLE_BRANCH}

      - run:
          name: Push image to registry
          command: |
            [ ! -f ~/.aws/oidc.env ] || . ~/.aws/oidc.env
            lumper push aws --project de-data-mcps --tag mcp-trino-${CIRCLE_BRANCH}

workflows:
  mcp_trino_image:
    jobs:
      - build-and-push:
          context: org-global
          filters:
            branches:
              only:
                - main
                - qa
  developer-productivity:
    jobs:
      - sentinel/default:
          context: org-global
